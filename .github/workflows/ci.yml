name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  test:
    name: test
    # Intended to skip the suite on typo PRs so reviewers don't wait.
    # Official docs: a skipped job reports Success and does not block
    # merge, even when the job is a required status check.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-only') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          python -m pip install -q pytest==9.1.1
          pytest -q
